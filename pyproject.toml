[project]
name = "hw6-race"
version = "1.00.0"
description = "HW6: Dual AI Agent Race via MCP Servers (Cop/Thief pursuit game)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.111.0",
    "fastmcp>=2.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hw6_race"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = [
    "src/hw6_race/main.py",
    "src/hw6_race/services/mcp/run_server.py",
    "*/tests/*",
    "src/hw6_race/**/gui/*",
]

[tool.coverage.report]
fail_under = 85
